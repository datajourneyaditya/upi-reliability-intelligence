version: 2
models:
  - name: int_bank_names__published
    description: Every bank / PSP name as published, with its normalised key and months seen.
  - name: int_bank_name_resolution
    description: Maps each published spelling to a canonical bank_id (alias seed first, then name key).
    columns:
      - name: name_published
        tests: [unique, not_null]
      - name: resolution_method
        tests:
          - accepted_values:
              values: [alias, name_key]
              config: {severity: warn}
  - name: int_bank_monthly__unioned
    description: Remitter and beneficiary rows on one bank x month x role grain.
  - name: int_bank_monthly__baselines
    description: Deltas, rolling 3-month baselines, volatility and degradation flag per bank x role.
    tests:
      - unique_combination: {columns: [bank_id, period_month, role]}
  - name: int_psp_monthly__baselines
    description: Same as bank baselines, for payer / payee PSP banks.
    tests:
      - unique_combination: {columns: [bank_id, period_month, role]}
